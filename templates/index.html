<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ wedding.partner_1 }} &amp; {{ wedding.partner_2 }} — Guest Photobooth</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='camera.css') }}">
</head>
<body>

<!-- Screen 1: intro video (tap anywhere to continue) -->
<div class="intro" id="intro">
  <div class="intro-box">
    <img class="still" id="introStill" src="{{ url_for('static', filename='intro-end.jpg') }}" alt="">
    {% if intro_video %}
    <video id="introVideo" src="{{ url_for('static', filename=intro_video) }}" poster="{{ url_for('static', filename='intro-start.jpg') }}"
           autoplay muted playsinline preload="auto"></video>
    {% endif %}
    <p class="intro-hint" id="introHint">continue to open camera</p>
  </div>
</div>

<!-- Screen 2: framed live camera -->
<div class="camera" id="camera">
  <div class="sheet">
    <div class="hole" id="hole">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <span class="vf-corner tl"></span><span class="vf-corner tr"></span>
      <span class="vf-corner bl"></span><span class="vf-corner br"></span>
      <p class="vf-hint">tap to capture</p>
      <button class="flip-btn" id="flipBtn" aria-label="Switch camera">⟳</button>
      <div class="success" id="successBox">
        <span class="icon">🤍</span>
        <h2 id="successTitle">Added to the album!</h2>
        <p id="successNote">Thank you for capturing this moment.</p>
      </div>
    </div>
    <img class="frame-art" src="{{ url_for('static', filename='camera-frame.webp') }}" alt="">
    <button class="shutter" id="shutterBtn" aria-label="Take photo"></button>
    <input class="name-field" type="text" id="guestName" placeholder="your name (optional)" maxlength="40" autocomplete="off">
  </div>
</div>
<canvas id="canvas" style="display:none;"></canvas>

<script>
const intro = document.getElementById('intro');
const introVideo = document.getElementById('introVideo');
const introStill = document.getElementById('introStill');
const introHint = document.getElementById('introHint');
const cameraScreen = document.getElementById('camera');
const hole = document.getElementById('hole');
const video = document.getElementById('cameraVideo');
const flipBtn = document.getElementById('flipBtn');
const shutterBtn = document.getElementById('shutterBtn');
const guestNameInput = document.getElementById('guestName');
const successBox = document.getElementById('successBox');
const successTitle = document.getElementById('successTitle');
const successNote = document.getElementById('successNote');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const FRAME_RATIO = 5 / 7;   // the hole in the artwork is 5:7 (portrait); saved photos match it

let mediaStream = null;
let facingMode = 'environment';
let opening = false;
let busy = false;

// ---------- intro ----------
function showHint() { introHint.classList.add('show'); }
function useStill() {                       // video can't autoplay -> show the final picture instead
  if (introVideo) introVideo.style.display = 'none';
  introStill.style.display = 'block';
  showHint();
}
if (introVideo) {
  introVideo.addEventListener('ended', showHint);
  introVideo.addEventListener('error', useStill);
  const p = introVideo.play();
  if (p && p.catch) p.catch(useStill);
  setTimeout(showHint, 6500);               // safety: hint appears even if 'ended' never fires
} else {
  useStill();
}

// ---------- camera ----------
async function requestStream() {
  const ideal = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode, ...ideal }, audio: false });
  } catch (err) {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    } catch (err2) {
      alert("We couldn't access your camera. Please check your browser's camera permission and try again.");
      return null;
    }
  }
  return mediaStream;
}
function stopStream() {
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
}
async function startViewfinder() {
  hole.classList.toggle('mirror', facingMode === 'user');
  const stream = await requestStream();
  if (stream) video.srcObject = stream;
  return !!stream;
}

intro.addEventListener('click', async () => {
  if (opening) return;
  opening = true;
  if (introVideo) introVideo.pause();
  const ok = await startViewfinder();
  if (!ok) { opening = false; return; }
  intro.classList.add('hide');
  cameraScreen.classList.add('show');
});

flipBtn.addEventListener('click', async (e) => {
  e.stopPropagation();
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  stopStream();
  await startViewfinder();
});

shutterBtn.addEventListener('click', snapPhoto);
hole.addEventListener('click', (e) => { if (e.target !== flipBtn) snapPhoto(); });

// ---------- capture: crop to the frame's shape, add the date stamp, upload ----------
function snapPhoto() {
  if (busy) return;
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return;
  busy = true;

  let sw = w, sh = h, sx = 0, sy = 0;       // centre-crop to match exactly what the viewfinder shows
  if (w / h > FRAME_RATIO) { sw = Math.round(h * FRAME_RATIO); sx = Math.round((w - sw) / 2); }
  else { sh = Math.round(w / FRAME_RATIO); sy = Math.round((h - sh) / 2); }

  canvas.width = sw;
  canvas.height = sh;
  if (facingMode === 'user') {
    ctx.save();
    ctx.translate(sw, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
    ctx.restore();
  } else {
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
  }
  stampTimestamp(sw, sh);

  stopStream();
  uploadPhoto();
}

function stampTimestamp(w, h) {
  const text = new Date().toLocaleString('en-US', {
    month: '2-digit', day: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  }).replace(',', '');
  const fontSize = Math.max(18, Math.round(w * 0.04));
  ctx.font = `700 ${fontSize}px 'Space Mono', monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  const pad = fontSize * 0.9;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillText(text, w - pad + 1.5, h - pad + 1.5);
  ctx.fillStyle = '#f4a33c';
  ctx.fillText(text, w - pad, h - pad);
}

async function uploadPhoto() {
  successTitle.textContent = 'Saving…';
  successNote.textContent = 'One moment';
  successBox.style.display = 'flex';
  try {
    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
    const res = await fetch('/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl, guest_name: guestNameInput.value })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Upload failed');
    successTitle.textContent = 'Added to the album!';
    successNote.textContent = 'Thank you for capturing this moment.';
  } catch (err) {
    successTitle.textContent = "That didn't save";
    successNote.textContent = "Let's try again: the camera is coming back.";
  } finally {
    setTimeout(resetForNext, 2400);
  }
}

async function resetForNext() {
  successBox.style.display = 'none';
  await startViewfinder();   // straight back to the live camera for the next shot
  busy = false;
}
</script>
</body>
</html>
