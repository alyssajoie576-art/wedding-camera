<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ wedding.partner_1 }} &amp; {{ wedding.partner_2 }} — Album Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Private Album</p>
  <h1 class="headline">{{ wedding.partner_1 }}<span class="amp">&amp;</span>{{ wedding.partner_2 }}</h1>
  <p class="subline">Enter the passcode to view your guests' photos</p>

  <div class="card">
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="field">
        <label for="passcode">Passcode</label>
        <input type="password" id="passcode" name="passcode" placeholder="••••••••" autofocus>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;">View Album</button>
    </form>
  </div>
</div>
</body>
</html>
